<?xml version="1.0" encoding="UTF-8"?>
<!--
  Q-SYS wordmark — simplified text glyph for the 21CAV draw.io builder.
  Q-SYS is QSC's networked control platform with its own visual identity;
  resolver matches 'q-sys' BEFORE 'qsc' to keep them distinct.
  viewBox 0 0 100 30 + currentColor per Plan 21-03 D-06.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 30" fill="currentColor">
  <text x="50" y="22" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="0.5">Q-SYS</text>
</svg>
